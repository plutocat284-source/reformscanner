
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FF7210">
<title>제보 관리 | 개혁스캐너</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6f8;color:#202124;font-family:Pretendard,sans-serif}
header{background:#fff;border-bottom:1px solid #e5e7eb;padding:18px 22px;font-weight:850}
main{max-width:1100px;margin:28px auto;padding:0 16px}
.panel{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:22px;margin-bottom:18px}
h1{font-size:1.5rem;margin:0 0 8px}h2{font-size:1.1rem;margin:0 0 15px}
p{color:#697078}
input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;padding:12px;border:1px solid #d7d9de;border-radius:9px;margin:6px 0 13px}
textarea{min-height:95px}
button{padding:11px 15px;border:0;border-radius:9px;background:#ff7210;color:#fff;font-weight:800;cursor:pointer}
button.secondary{background:#eef0f3;color:#24272b}
button:disabled{opacity:.5}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
.hidden{display:none!important}
#message{padding:12px;background:#fff4e9;border-radius:9px;margin:10px 0;white-space:pre-wrap}
.report-list{display:grid;gap:9px}
.report-item{padding:14px;border:1px solid #e3e5e9;border-radius:10px;background:#fff;text-align:left;color:#202124;width:100%}
.report-item:hover{border-color:#ff7210}
.report-item small{display:block;color:#687078;margin-top:5px}
.tag{display:inline-block;background:#fff0e5;color:#a84800;padding:3px 8px;border-radius:6px;font-size:.8rem}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.detail-grid section{min-width:0;overflow-wrap:anywhere}
.value{white-space:pre-wrap;overflow-wrap:anywhere}
#reportPhoto{display:block;max-width:100%;max-height:480px;border-radius:10px;margin-top:10px}
@media(max-width:650px){.detail-grid{grid-template-columns:1fr}.panel{padding:16px}}
.detail-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:15px;
}

.detail-header h2{
  margin:0;
}

button.danger{
  background:#dc2626;
  color:#fff;
  flex:0 0 auto;
}

button.danger:hover{
  background:#b91c1c;
}

@media(max-width:450px){
  .detail-header{
    align-items:flex-start;
  }
}
</style>
</head>
<body>
<header>개혁스캐너 · 관리자</header>
<main>
  <section class="panel" id="loginPanel">
    <h1>관리자 로그인</h1>
    <p>승인된 관리자만 제보 자료를 열람할 수 있습니다.</p>
    <form id="loginForm">
      <label for="username">관리자 아이디</label>
      <input id="username" autocomplete="username" required>
      <label for="password">비밀번호</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit">로그인</button>
    </form>
  </section>

  <section class="panel hidden" id="dashboard">
    <div class="row">
      <div><h1>제보 관리</h1><p id="countText">제보 목록을 불러오는 중입니다.</p></div>
      <button class="secondary" id="refreshButton">새로고침</button>
      <button class="secondary" id="logoutButton">로그아웃</button>
    </div>
    <div class="row">
<select id="statusFilter" aria-label="처리 상태 필터">
  <option value="">전체 상태</option>
  <option>접수</option>
  <option>확인 중</option>
  <option>처리 중</option>
  <option>처리 완료</option>
  <option>반려</option>
</select>
      <button id="loadButton">목록 불러오기</button>
    </div>
    <div class="report-list" id="reportList"></div>
    <div class="row" style="margin-top:14px">
      <button class="secondary" id="prevButton">이전</button>
      <span id="pageText" style="text-align:center">1페이지</span>
      <button class="secondary" id="nextButton">다음</button>
    </div>
  </section>

<section class="panel hidden" id="detailPanel">
  <div class="detail-header">
    <h2>제보 상세 내용</h2>
    <button type="button" class="danger" id="deleteButton">제보 삭제</button>
  </div>
    <div class="detail-grid">
      <section><strong>장소</strong><div class="value" id="dLocation"></div></section>
      <section><strong>접수 일시</strong><div class="value" id="dCreated"></div></section>
      <section><strong>문제 유형</strong><div class="value" id="dTypes"></div></section>
      <section><strong>우선순위</strong><div class="value" id="dUrgency"></div></section>
      <section><strong>제보 내용</strong><div class="value" id="dDescription"></div></section>
      <section><strong>AI 관찰 내용</strong><div class="value" id="dObservation"></div></section>
      <section><strong>불편 가능성</strong><div class="value" id="dImpact"></div></section>
      <section><strong>권장 확인 사항</strong><div class="value" id="dAction"></div></section>
    </div>
    <div style="margin-top:18px">
      <strong>첨부 사진</strong>
      <div><button class="secondary" id="photoButton">사진 보기</button></div>
      <img id="reportPhoto" class="hidden" alt="제보 첨부 사진">
    </div>
    <hr style="border:0;border-top:1px solid #eee;margin:22px 0">
    <h2>처리 정보</h2>
    <label for="dStatus">처리 상태</label>
<select id="dStatus">
  <option>접수</option>
  <option>확인 중</option>
  <option>처리 중</option>
  <option>처리 완료</option>
  <option>반려</option>
</select>
    <label for="dNote">관리자 메모</label>
    <textarea id="dNote" maxlength="2000" placeholder="내부 처리 기록을 입력하세요."></textarea>
    <div class="row">
      <button id="saveButton">변경 사항 저장</button>
      <button class="secondary" id="closeDetail">상세 닫기</button>
    </div>
  </section>
  <div id="message" role="status" aria-live="polite"></div>
</main>

<script>
(() => {
  "use strict";

  const SUPABASE_URL = "https://xyiwheeuwvxodmdkrqqt.supabase.co";
  // 시민용 HTML에 사용한 동일한 공개 anon 키를 이곳에도 설정하세요.
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5aXdoZWV1d3Z4b2RtZGtycXF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5OTQ4MTIsImV4cCI6MjEwODU3MDgxMn0.VFQPA1OXjuVoXk4hweWZixPravxPFAVosXtYqtFip9w";
  const endpoint = `${SUPABASE_URL}/functions/v1/scanner-admin`;
  const $ = id => document.getElementById(id);

  let token = "";
  let page = 1;
  const pageSize = 20;
  let currentId = "";

  function message(text) { $("message").textContent = text || ""; }

  async function api(action, data = {}, needsAuth = true) {
    const headers = {
      "Content-Type": "application/json",
      "apikey": SUPABASE_ANON_KEY
    };
    if (needsAuth && token) headers.Authorization = `Bearer ${token}`;

    const response = await fetch(endpoint, {
      method: "POST",
      headers,
      body: JSON.stringify({ action, ...data })
    });
    const result = await response.json().catch(() => ({}));

    if (response.status === 401 && needsAuth) {
      logout();
      throw new Error("로그인이 만료되었습니다. 다시 로그인해 주세요.");
    }
    if (!response.ok) throw new Error(result.error || `요청 실패 (${response.status})`);
    return result;
  }

  function showDashboard() {
    $("loginPanel").classList.add("hidden");
    $("dashboard").classList.remove("hidden");
  }

  function logout() {
    token = "";
    currentId = "";
    $("loginPanel").classList.remove("hidden");
    $("dashboard").classList.add("hidden");
    $("detailPanel").classList.add("hidden");
    $("password").value = "";
    $("reportList").replaceChildren();
  }

  $("loginForm").addEventListener("submit", async event => {
    event.preventDefault();
    message("로그인 확인 중입니다.");
    try {
      const result = await api("login", {
        username: $("username").value.trim(),
        password: $("password").value
      }, false);
      token = result.token;
      showDashboard();
      page = 1;
      await loadReports();
      message("로그인되었습니다.");
    } catch (error) {
      message(error.message || "로그인에 실패했습니다.");
    }
  });

  async function loadReports() {
    try {
      const result = await api("list", {
        page,
        limit: pageSize,
        status: $("statusFilter").value
      });
$("countText").textContent = `총 ${result.total ?? 0}건`;
      $("pageText").textContent = `${page}페이지`;
      $("reportList").replaceChildren();

      for (const report of result.reports || []) {
        const button = document.createElement("button");
        button.className = "report-item";
        button.type = "button";

        const title = document.createElement("strong");
        title.textContent = report.location;
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = report.status;
        const meta = document.createElement("small");
        meta.textContent =
          `${(report.types || []).join(", ")} · ${report.urgency} · ` +
          new Date(report.created_at).toLocaleString("ko-KR");

        button.append(title, document.createTextNode(" "), tag, meta);
        button.addEventListener("click", () => openDetail(report.id));
        $("reportList").append(button);
      }
      if (!(result.reports || []).length) {
        const empty = document.createElement("p");
        empty.textContent = "표시할 제보가 없습니다.";
        $("reportList").append(empty);
      }
      message("");
    } catch (error) {
      message(error.message);
    }
  }

  async function openDetail(id) {
    try {
      const result = await api("detail", { id });
      const r = result.report;
      currentId = r.id;

      $("dLocation").textContent = r.location;
      $("dCreated").textContent = new Date(r.created_at).toLocaleString("ko-KR");
      $("dTypes").textContent = (r.types || []).join(", ");
      $("dUrgency").textContent = r.urgency;
      $("dDescription").textContent = r.description;
      $("dObservation").textContent = r.observation;
      $("dImpact").textContent = r.impact;
      $("dAction").textContent = r.action;
      $("dStatus").value = r.status;
      $("dNote").value = r.admin_note || "";
      $("reportPhoto").classList.add("hidden");
      $("reportPhoto").removeAttribute("src");

      $("detailPanel").classList.remove("hidden");
      $("detailPanel").scrollIntoView({ behavior: "smooth", block: "start" });
      message("");
    } catch (error) {
      message(error.message);
    }
  }

  $("photoButton").addEventListener("click", async () => {
    if (!currentId) return;
    try {
      const result = await api("photo", { id: currentId });
$("reportPhoto").src = result.signedUrl;
      $("reportPhoto").classList.remove("hidden");
      message("사진 링크는 60초 동안 유효합니다.");
    } catch (error) {
      message(error.message);
    }
  });
$("deleteButton").addEventListener("click", async () => {
  if (!currentId) {
    message("삭제할 제보를 먼저 선택해 주세요.");
    return;
  }

  const confirmed = window.confirm(
    "이 제보를 삭제하시겠습니까?\n삭제한 제보는 복구할 수 없습니다."
  );

  if (!confirmed) return;

  const button = $("deleteButton");
  button.disabled = true;
  message("제보를 삭제하는 중입니다.");

  try {
const result = await api("delete", { id: currentId });

currentId = "";
$("detailPanel").classList.add("hidden");
$("reportPhoto").removeAttribute("src");
$("reportPhoto").classList.add("hidden");

await loadReports();

if (result.photoDeleted === false) {
  message(result.warning || "제보는 삭제되었지만 사진 삭제에 실패했습니다.");
} else {
  message("제보가 삭제되었습니다.");
}

  } catch (error) {
    message("제보 삭제 실패: " + (error.message || "알 수 없는 오류"));
  } finally {
    button.disabled = false;
  }
});
  $("saveButton").addEventListener("click", async () => {
    if (!currentId) return;
    $("saveButton").disabled = true;
    try {
      await api("update", {
        id: currentId,
        status: $("dStatus").value,
        admin_note: $("dNote").value
      });
      message("변경 사항을 저장했습니다.");
      await loadReports();
    } catch (error) {
      message(error.message);
    } finally {
      $("saveButton").disabled = false;
    }
  });

  $("loadButton").addEventListener("click", () => { page = 1; loadReports(); });
  $("refreshButton").addEventListener("click", loadReports);
  $("prevButton").addEventListener("click", () => {
    if (page > 1) { page--; loadReports(); }
  });
  $("nextButton").addEventListener("click", () => { page++; loadReports(); });
  $("closeDetail").addEventListener("click", () => {
    $("detailPanel").classList.add("hidden");
    currentId = "";
  });
  $("logoutButton").addEventListener("click", logout);
})();
</script>
</body>
</html>
